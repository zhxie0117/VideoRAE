<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="VideoRAE">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B4F6C"/>
      <stop offset="55%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#0891B2"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="100%" stop-color="#BAE6FD"/>
    </linearGradient>
    <linearGradient id="latent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <rect width="128" height="128" rx="28" fill="url(#bg)"/>

  <!-- temporal frames -->
  <g opacity="0.55">
    <rect x="20" y="34" width="34" height="44" rx="7" fill="url(#frame)"/>
  </g>
  <g opacity="0.8">
    <rect x="34" y="40" width="34" height="44" rx="7" fill="url(#frame)"/>
  </g>
  <rect x="48" y="46" width="34" height="44" rx="7" fill="url(#frame)"/>

  <!-- encode arrow into latent -->
  <path d="M84 68 H94" stroke="#ECFEFF" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M91 63 L98 68 L91 73" fill="none" stroke="#ECFEFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- latent gem -->
  <path d="M104 56 L114 68 L104 80 L94 68 Z" fill="url(#latent)"/>
  <path d="M104 56 L114 68 L104 68 Z" fill="#FEF3C7" opacity="0.55"/>

  <!-- decode arc -->
  <path d="M28 98 C58 112, 92 112, 110 92" fill="none" stroke="#A5F3FC" stroke-width="3.5" stroke-linecap="round" opacity="0.9"/>
  <path d="M104 88 L110 92 L106 98" fill="none" stroke="#A5F3FC" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
